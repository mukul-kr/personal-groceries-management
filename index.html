<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo Kitchen</title>
<style>
  /* Layout: sticky top bar with three tabs; content is a card grid (Cook), grouped checklists (Kitchen), two-column planner (Shop). */
  :root {
    --bg: #f6f7f4; --surface: #ffffff; --fg: #1d2420; --muted: #5d6a62; --line: #dde3dc;
    --accent: #2f6b45; --accent-soft: #e3efe6; --warn: #b5651d; --warn-soft: #fbeedd;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --surface: #1b211e; --fg: #e6ebe7; --muted: #9aa8a0; --line: #2c3530;
      --accent: #7cc497; --accent-soft: #20352a; --warn: #f0a868; --warn-soft: #3a2a1a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; color: var(--muted); }
  nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
  .summary { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; color: var(--muted); }
  .summary b { color: var(--fg); font-size: 22px; font-variant-numeric: tabular-nums; margin-right: 4px; }

  .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 64px; }
  .chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  input[type="search"] { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn.small { padding: 3px 10px; font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card.flash { outline: 3px solid var(--accent); }
  .card h3 { margin: 0; font-size: 16px; text-wrap: balance; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .meta .p { color: var(--accent); font-weight: 600; text-transform: capitalize; }
  .ings { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; }
  .ing { padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); }
  .ing.miss { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .opt { font-size: 12px; color: var(--muted); }
  details { font-size: 13.5px; }
  summary { cursor: pointer; color: var(--muted); }
  .actions { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .status { font-size: 12px; font-weight: 600; }
  .status.ok { color: var(--accent); } .status.no { color: var(--warn); }
  .empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

  .cats { columns: 3 300px; column-gap: 16px; }
  .cat { break-inside: avoid; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .cat h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .item:first-of-type { border-top: 0; }
  .item label { flex: 1; cursor: pointer; }
  .item small { color: var(--muted); font-size: 12px; display: block; }
  .used { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .shop { grid-template-columns: 1fr; } nav { margin-left: 0; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel h2 { margin: 0 0 4px; font-size: 17px; }
  .panel p.hint { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .unlock { color: var(--accent); font-weight: 700; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
  .group-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 2px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Solo Kitchen<small>what can I cook, what should I buy</small></div>
    <nav role="tablist">
      <button role="tab" data-tab="cook">Cook</button>
      <button role="tab" data-tab="kitchen">My kitchen</button>
      <button role="tab" data-tab="shop">Shop</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<!-- Plain scripts (no modules) so it works by double-clicking the file. -->
<script src="data.cjs"></script>
<script src="logic.cjs"></script>
<script src="app.js"></script>
</body>
</html>
